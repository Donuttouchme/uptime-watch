[project]
name = "uptime-watch"
version = "0.1.0"
description = "Backend for uptime-watch: API, scheduler and worker."
readme = "README.md"
authors = [
    { name = "polgar.donat", email = "59120493+Donuttouchme@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
uptime-watch-scheduler = "uptime_watch.scheduler:main"
uptime-watch-worker = "uptime_watch.worker:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
